name: Bug report
description: Report a problem with RHELboat or a practice lesson
title: "[Bug] "
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Check the [RHELboat issue tracker](https://github.com/ochoaj92-lgtm/RHELboat/issues) for an existing report first.
              For security concerns, follow [SECURITY.md](https://github.com/ochoaj92-lgtm/RHELboat/blob/main/SECURITY.md) instead of posting details here.
    - type: input
      id: version
      attributes:
          label: RHELboat version
          placeholder: Version or commit, and packaged app or development mode
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Environment
          placeholder: |
              Linux distribution and version:
              Desktop environment:
              Podman or Docker version:
              Node.js version, if running from source:
      validations:
          required: true
    - type: input
      id: lesson
      attributes:
          label: Learning path and lesson
          description: Include the exam code and lesson title if this affects a lesson.
    - type: textarea
      id: reproduce
      attributes:
          label: Steps to reproduce
          description: Include the commands or actions that trigger the problem.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
      validations:
          required: true
    - type: textarea
      id: evidence
      attributes:
          label: Error output or screenshots
          description: Include relevant shell or application error output. Remove credentials, personal paths, and other sensitive information.
          render: text
