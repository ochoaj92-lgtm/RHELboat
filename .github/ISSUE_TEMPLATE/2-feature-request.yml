name: Feature or lesson request
description: Suggest an improvement to Enterprise Linux practice in RHELboat
title: "[Feature] "
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Check the [RHELboat issue tracker](https://github.com/ochoaj92-lgtm/RHELboat/issues) for related requests first.
              Suggest original practice exercises rather than official exam questions or copied courseware.
    - type: textarea
      id: problem
      attributes:
          label: Learning goal or problem
          description: What should a learner be able to understand or do?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed improvement
          description: Describe the smallest useful change. For lessons, include the category, topic, source workbook section, and PDF page range when available.
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Practice environment
          description: Does this need a container, disposable RHEL VM, or multiple machines? Note any product or subscription requirements.
    - type: textarea
      id: verification
      attributes:
          label: How a learner could verify the result
          description: Describe an observable outcome or self-review question.
