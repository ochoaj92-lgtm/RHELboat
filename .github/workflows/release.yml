name: Build RHELboat
on:
    push:
        branches: [main, RHELBoat-v1, windows-installer]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    linux:
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install Linux packaging tools
              run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
            - run: npm ci
            - run: npm run typecheck && npm test
            - name: Package Linux trainer
              run: npm run build:linux
              env:
                  ELECTRON_BUILDER_COMPRESSION_LEVEL: 5
            - uses: actions/upload-artifact@v7
              with:
                  name: rhelboat-linux
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.rpm
                      dist/*.pacman
                      dist/*.tar.bz2
    windows:
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - name: Build Windows installer
              run: npm run build:win
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
            - name: Install, launch and uninstall
              shell: pwsh
              run: |
                  $installer = Get-ChildItem dist/RHELboat-Setup-*-x64.exe | Select-Object -First 1
                  $installDir = Join-Path $env:RUNNER_TEMP 'RHELboat Installer Test'
                  $installed = Start-Process -FilePath $installer.FullName -ArgumentList "/S /currentuser /D=$installDir" -Wait -PassThru
                  if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
                  try {
                      node scripts/windows-smoke.mjs "$installDir/RHELboat.exe"
                      if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
                  } finally {
                      $uninstaller = Join-Path $installDir 'Uninstall RHELboat.exe'
                      if (Test-Path $uninstaller) {
                          $removed = Start-Process -FilePath $uninstaller -ArgumentList "/S _?=$installDir" -Wait -PassThru
                          if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
                      }
                  }
            - uses: actions/upload-artifact@v7
              id: installer
              with:
                  name: rhelboat-windows-x64
                  if-no-files-found: error
                  path: |
                      dist/RHELboat-Setup-*-x64.exe
                      dist/RHELboat-Setup-*-x64.exe.blockmap
            - name: Show installer download and build instructions
              shell: pwsh
              env:
                  INSTALLER_URL: ${{ steps.installer.outputs.artifact-url }}
              run: |
                  $summary = @'
                  ## Windows x64 installer

                  [Download the installer ZIP]({0}) · [Open the builder]({1}/{2}/actions/workflows/release.yml?query=branch%3Awindows-installer) · [Full build instructions]({1}/{2}/blob/{3}/docs/WINDOWS.md#build-with-github-actions)

                  Extract the ZIP and run `RHELboat-Setup-<version>-x64.exe`. This build is unsigned.

                  Typechecking, portable tests, installation into a path with spaces, app launch and uninstallation passed. Docker Desktop labs and external RHEL VM exercises still need Windows desktop testing.

                  ### Build again on GitHub

                  Open the builder, select **Run workflow**, choose the **windows-installer** branch, then select **Run workflow**. Manual runs on this branch build Windows only. GitHub requires repository write access to start a build and a signed-in account to download artifacts.

                  ### Build locally on Windows

                  With Node.js 24+ and npm, check out the `windows-installer` branch and run:

                  ```powershell
                  npm ci
                  npm run typecheck
                  npm test
                  npm run build:win
                  ```

                  The installer is written to `dist/RHELboat-Setup-<version>-x64.exe`.
                  '@
                  $summary -f $env:INSTALLER_URL, $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_SHA | Add-Content -Path $env:GITHUB_STEP_SUMMARY
